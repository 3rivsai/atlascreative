<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b18" />
    <title>Thank You | Paul Durko</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #080b18;
        color: #f4f5ff;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 32px;
        isolation: isolate;
      }

      main::before,
      main::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
      }

      main::before {
        background: url("thank-you-background.png") center / cover no-repeat;
        opacity: 0.58;
      }

      main::after {
        background:
          linear-gradient(90deg, rgba(8, 11, 24, 0.96), rgba(8, 11, 24, 0.64) 58%, rgba(8, 11, 24, 0.88)),
          linear-gradient(0deg, rgba(8, 11, 24, 0.94), rgba(8, 11, 24, 0.22) 68%, rgba(8, 11, 24, 0.58));
      }

      .message {
        width: min(100%, 760px);
        border-left: 2px solid #8c92ff;
        padding: 16px 0 16px 36px;
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.6rem, 7vw, 5.5rem);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 0.98;
      }

      p {
        max-width: 57ch;
        margin: 30px 0 0;
        color: rgba(237, 239, 255, 0.82);
        font-size: clamp(1rem, 2.25vw, 1.35rem);
        letter-spacing: 0;
        line-height: 1.65;
      }

      .signature {
        margin-top: 28px;
        color: #c6c9ff;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      @media (max-width: 560px) {
        main {
          padding: 26px;
          background: #080b18;
        }

        main::before {
          background-position: center top;
          opacity: 0.78;
        }

        main::after {
          background: linear-gradient(to bottom, rgba(8, 11, 24, 0.48), rgba(8, 11, 24, 0.68) 58%, rgba(8, 11, 24, 0.94));
        }

        .message { padding-left: 24px; }
        p { margin-top: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="message" aria-labelledby="thank-you-title">
        <h1 id="thank-you-title">Thank You For Your Payment</h1>
        <p>Hey just wanted to let you know I received you payment. I will get to work on the ads ASAP and have them delivered within 10 days. They are going to crush!</p>
        <div class="signature">- Paul Durko</div>
      </section>
    </main>
  </body>
</html>
